<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UncleStev</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0f14">
<style>
  :root{
    --bg:#0d0f14; --card:#161a22; --ink:#e9edf5; --dim:#8a93a6; --ring:#2a3140;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;
    max-width:1100px;margin:0 auto;padding:28px 20px 8px}
  h1{margin:0;font-size:clamp(22px,4vw,30px);letter-spacing:.5px;font-weight:800}
  h1 span{background:linear-gradient(90deg,#ffb347,#ff5f6d,#7b6cff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .gh{color:var(--dim);display:inline-flex;padding:8px;border-radius:10px}
  .gh:hover{color:var(--ink);background:var(--card)}
  main{max-width:1100px;margin:0 auto;padding:16px 20px 48px;
    display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .tile{position:relative;background:var(--card);border:1px solid var(--ring);
    border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease}
  .tile:hover,.tile:focus-visible{transform:translateY(-4px);
    border-color:var(--c);box-shadow:0 10px 30px -10px var(--c);outline:none}
  .art{aspect-ratio:16/10;display:grid;place-items:center;position:relative;
    background:radial-gradient(120% 120% at 20% 10%,var(--c) 0%,transparent 60%),
               linear-gradient(135deg,#1d2230,#11141b)}
  .art .emoji{font-size:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
  .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .meta{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
  .name{font-weight:700;font-size:16px}
  .code{color:var(--dim);display:inline-flex;padding:6px;border-radius:8px;position:relative;z-index:2}
  .code:hover{color:var(--ink);background:#222838}
  .new{position:absolute;top:10px;left:10px;z-index:2;font-size:11px;font-weight:800;
    letter-spacing:.6px;background:var(--c);color:#0d0f14;padding:3px 8px;border-radius:99px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding-bottom:28px}
</style>
</head>
<body>

<header>
  <h1><span>UncleStev</span></h1>
  <a class="gh" href="https://github.com/unclestev" aria-label="GitHub profile" title="GitHub">
    <svg width="26" height="26" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38v-1.34c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.19c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
</header>

<main id="grid"></main>
<footer id="foot"></footer>

<script>
/* ===== Edit this list to control order, emoji, color and image =====
   repo  : GitHub repo name (case matters for the Pages URL)
   title : label on the tile (optional)
   emoji : fallback art
   color : accent color
   img   : optional image URL. If left out, the page tries
           img/<repo>.jpg in this repo
           and falls back to the emoji tile.
   url   : optional link override (defaults to the GitHub Pages site)
*/
const USER = "unclestev";
const APPS = [
  { repo:"arcade",       title:"Arcade",       emoji:"🕹️", color:"#ff5f6d" },
  { repo:"dirtboxrally", title:"Dirtbox Rally",emoji:"🏁", color:"#ffb347" },
  { repo:"Bomber",       title:"Bomber",       emoji:"💣", color:"#ff7a45" },
  { repo:"explorer3D",   title:"Explorer 3D",  emoji:"🌐", color:"#7b6cff" },
  { repo:"gps-explorer", title:"GPS Explorer", emoji:"📍", color:"#2ecc9a" },
  { repo:"Weatherville", title:"Weatherville", emoji:"⛅", color:"#4fb3ff" },
  { repo:"tesla-ledger", title:"Tesla Ledger", emoji:"⚡", color:"#e8e8e8" },
];
const HIDE = ["home", `${USER}.github.io`];       // repos never shown
const PALETTE = ["#ff5f6d","#ffb347","#7b6cff","#2ecc9a","#4fb3ff","#f06bd0","#c3e65a"];
const NEW_DAYS = 14;                                 // "NEW" badge window

const ghIcon = '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38v-1.34c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.19c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';

const pretty = s => s.replace(/[-_]/g," ").replace(/([a-z])([A-Z])/g,"$1 $2")
                     .replace(/\b\w/g,c=>c.toUpperCase());

function tile(a, i){
  const c   = a.color || PALETTE[i % PALETTE.length];
  const url = a.url || (a.pages === false ? `https://github.com/${USER}/${a.repo}`
                                          : `https://${USER}.github.io/${a.repo}/`);
  const img = a.img || `img/${a.repo}.jpg`;
  const el = document.createElement("a");
  el.className = "tile"; el.href = url; el.style.setProperty("--c", c);
  el.title = a.desc || a.title || a.repo;
  el.innerHTML = `
    ${a.isNew ? '<span class="new">NEW</span>' : ""}
    <div class="art"><span class="emoji">${a.emoji || "✨"}</span>
      <img alt="" loading="lazy" src="${img}" onerror="this.remove()"></div>
    <div class="meta"><span class="name">${a.title || pretty(a.repo)}</span>
      <a class="code" href="https://github.com/${USER}/${a.repo}" aria-label="Source code" title="Code">${ghIcon}</a></div>`;
  return el;
}

function render(list){
  const g = document.getElementById("grid");
  g.replaceChildren(...list.map(tile));
  document.getElementById("foot").textContent = `${list.length} apps`;
}

render(APPS);  // instant, works offline

// Pick up new repos automatically + real Pages/description info.
fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`)
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(repos => {
    const now = Date.now(), byName = {};
    repos.forEach(r => byName[r.name.toLowerCase()] = r);
    const merged = APPS.map(a => {
      const r = byName[a.repo.toLowerCase()];
      return r ? {...a, desc:r.description, pages: a.pages ?? r.has_pages,
                  isNew: now - Date.parse(r.created_at) < NEW_DAYS*864e5} : a;
    });
    const known = new Set(APPS.map(a => a.repo.toLowerCase()));
    repos.filter(r => !r.fork && !r.archived
                   && !known.has(r.name.toLowerCase())
                   && !HIDE.includes(r.name.toLowerCase()))
         .forEach(r => merged.push({ repo:r.name, desc:r.description, pages:r.has_pages,
                   isNew: now - Date.parse(r.created_at) < NEW_DAYS*864e5 }));
    render(merged);
  })
  .catch(() => {});
</script>
</body>
</html>
